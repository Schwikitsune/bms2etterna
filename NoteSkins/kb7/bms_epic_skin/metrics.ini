#Port of R Skin v2.1 (7k)
#26/07/2020
#Noteskin structure based off "retrobar-razor_Max" made by ecafree2. The original can be found at www.youtube.com/ecafree2
#R skin is originally by Retsukiya(https://osu.ppy.sh/users/1326008)
#Also big big shoutout to poco0317, ecafree2, and Jousway for being my main sources for information about noteskins
#This project would never have taken off without them


[NoteDisplay]
HoldLetGoGrayPercent=.8
DrawHoldHeadForTapsOnSameRow=0
StartDrawingHoldBodyOffsetFromHead=0
StartDrawingRollBodyOffsetFromHead=0
StopDrawingHoldBodyOffsetFromTail=0
TapNoteNoteColorTextureCoordSpacingX=0
TapNoteNoteColorTextureCoordSpacingY=0
# control the vertical
TapNoteAdditionTextureCoordOffsetX=0
TapNoteAdditionTextureCoordOffsetY=0.5
FlipHeadAndTailWhenReverse=1
FlipHoldBodyWhenReverse=1
TopHoldAnchorWhenReverse=1

TapFakeAdditionTextureCoordOffsetX=0
TapFakeAdditionTextureCoordOffsetY=0
TapLiftAdditionTextureCoordOffsetX=0
TapLiftAdditionTextureCoordOffsetY=0

HoldHeadNoteColorTextureCoordSpacingX=0
HoldHeadNoteColorTextureCoordSpacingY=0
[GhostArrowDim]
NoneCommand=
HitMineCommand=blend,'BlendMode_Add';diffuse,1,1,1,1;zoom,1;rotationz,0;linear,0.3;rotationz,90;linear,0.3;rotationz,180;diffusealpha,0
MissCommand=
W5Command=
W4Command=
W3Command=diffusealpha,1
W2Command=diffusealpha,1
W1Command=diffusealpha,1
HeldCommand=diffusealpha,1


[GhostArrowBright]
NoneCommand=
HitMineCommand=blend,'BlendMode_Add';diffuse,1,1,1,1;zoom,1;rotationz,0;linear,0.3;rotationz,90;linear,0.3;rotationz,180;diffusealpha,0
MissCommand=
W5Command=
W4Command=
W3Command=diffusealpha,1
W2Command=diffusealpha,1
W1Command=diffusealpha,1
HeldCommand=diffusealpha,1

[Bom]
W5Command=setstate,0;blend,'BlendMode_Add';zoom,.05;diffusealpha,0;linear,.032;zoom,.6;diffusealpha,1;linear,.064;diffusealpha,1;zoom,.9;linear,.032;zoom,.2;diffusealpha,0
W4Command=setstate,0;blend,'BlendMode_Add';zoom,.05;diffusealpha,0;linear,.032;zoom,.6;diffusealpha,1;linear,.064;diffusealpha,1;zoom,.9;linear,.032;zoom,.2;diffusealpha,0
W3Command=setstate,0;blend,'BlendMode_Add';zoom,.05;diffusealpha,0;linear,.032;zoom,.6;diffusealpha,1;linear,.064;diffusealpha,1;zoom,.9;linear,.032;zoom,.2;diffusealpha,0
W2Command=setstate,0;blend,'BlendMode_Add';zoom,.05;diffusealpha,0;linear,.032;zoom,.6;diffusealpha,1;linear,.064;diffusealpha,1;zoom,.9;linear,.032;zoom,.2;diffusealpha,0
W1Command=setstate,0;blend,'BlendMode_Add';zoom,.05;diffusealpha,0;linear,.032;zoom,.6;diffusealpha,1;linear,.064;diffusealpha,1;zoom,.9;linear,.032;zoom,.2;diffusealpha,0
HeldCommand=HeldCommand=diffusealpha,0

[Boom]
NoneCommand=
HitMineCommand=blend,'BlendMode_Add';diffuse,1,1,1,1;zoom,1;rotationz,0;linear,0.3;rotationz,90;linear,0.3;rotationz,180;diffusealpha,0
MissCommand=
W5Command=blend,'BlendMode_Add';zoom,.1;diffuse,0,0,1,.5;glow,0,0,.8,.5;linear,0.075;zoom,.5;;linear,0.075;zoom,1;diffuse,0,0,1,0;glow,0,0,.8,0
W4Command=blend,'BlendMode_Add';zoom,.1;diffuse,0,0,1,.5;glow,0,0,.8,.5;linear,0.075;zoom,.5;;linear,0.075;zoom,1;diffuse,0,0,1,0;glow,0,0,.8,0
W3Command=blend,'BlendMode_Add';zoom,.1;diffuse,0,0,1,.5;glow,0,0,.8,.5;linear,0.075;zoom,.5;;linear,0.075;zoom,1;diffuse,0,0,1,0;glow,0,0,.8,0
W2Command=blend,'BlendMode_Add';zoom,.1;diffuse,0,0,1,.5;glow,0,0,.8,.5;linear,0.075;zoom,.5;;linear,0.075;zoom,1;diffuse,0,0,1,0;glow,0,0,.8,0
W1Command=blend,'BlendMode_Add';zoom,.1;diffuse,0,0,1,.5;glow,0,0,.8,.5;linear,0.075;zoom,.5;;linear,0.075;zoom,1;diffuse,0,0,1,0;glow,0,0,.8,0
HeldCommand=diffusealpha,0

[ReceptorArrow]
InitCommand=
NoneCommand=


[ReceptorPressLight]
InitCommand=vertalign,bottom;diffusealpha,0
PressCommand=finishtweening;blend,'BlendMode_Add';accelerate,.05;diffusealpha,.4
LiftCommand=finishtweening;blend,'BlendMode_Add';linear,.1;diffusealpha,0

[ReceptorGhost]
InitCommand=vertalign,top;addy,-360;diffusealpha,0
W3Command=finishtweening;blend,'BlendMode_Add';zoomx,.8;zoomy,1;diffusealpha,.3;decelerate,.1;zoomx,.5;zoomy,.2;diffusealpha,.1;decelerate,.02;diffusealpha,0
W2Command=finishtweening;blend,'BlendMode_Add';zoomx,.8;zoomy,1;diffusealpha,.3;decelerate,.1;zoomx,.5;zoomy,.2;diffusealpha,.1;decelerate,.02;diffusealpha,0
W1Command=finishtweening;blend,'BlendMode_Add';zoomx,.8;zoomy,1;diffusealpha,.3;decelerate,.1;zoomx,.5;zoomy,.2;diffusealpha,.1;decelerate,.02;diffusealpha,0

[ReceptorButton]
InitCommand=y,0;diffusealpha,1
PressCommand=y,0;diffusealpha,0
LiftCommand=y,0;diffusealpha,1

[HoldGhostArrow]
HoldingOnCommand=diffusealpha,1
HoldingOffCommand=diffusealpha,0
InitCommand=diffusealpha,0

[Holding1]
HoldingOnCommand=

[Holding2]
HoldingOnCommand=diffusealpha,1;blend,'BlendMode_Add';zoomx,1;zoom,2.5